<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Sticky Table</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th,
  td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  thead th {
    position: sticky;
    top: 0;
    background: #b3d9ff;
  }

  tr td:first-child,
  thead th:first-child {
    position: sticky;
    left: 0;
    background: #99ccff;
  }

  tbody tr:nth-child(even) {
    background: #f2f2f2;
  }
</style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Line</th>
        <th>Column 1</th>
        <th>Column 2</th>
        <th>Column 3</th>
        <th>Column 4</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Line 1</td>
        <td>23</td>
        <td>123</td>
        <td>43</td>
        <td>12</td>
      </tr>
      <tr>
        <td>Line 2</td>
        <td>34</td>
        <td>61</td>
        <td>43</td>
        <td>12</td>
      </tr>
      <tr>
        <td>Line 3</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Line 4</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Line 5</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Line 6</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Line 7</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Line 8</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
        <td>23</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
